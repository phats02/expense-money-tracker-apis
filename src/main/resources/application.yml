# Common settings for all environments
spring:
  application:
    name: ExpenseMoneyTracker
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}

# Default profile (will be overridden by environment-specific profiles)
---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:postgresql://localhost:5432/express-money-tracker-db
    username: admin
    password: admin

app:
  jwtSecret: dev-secret-not-for-production

org:
  slf4j:
    simpleLogger:
      defaultLogLevel: debug
